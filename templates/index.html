<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAM3 Live Teleop</title>
    <style>
        /* --- Styles --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0a; color: #e0e0e0;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 10px 20px; 
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); height: 70px;
        }
        
        .header-left { display: flex; flex-direction: column; justify-content: center; }
        .header h1 { color: #fff; font-size: 20px; margin: 0; line-height: 1.2; }
        .header-instructions { font-size: 13px; color: #aaa; margin-top: 4px; }
        .highlight-pos { color: #10b981; font-weight: bold; }
        .highlight-neg { color: #ef4444; font-weight: bold; }

        .header-right { display: flex; align-items: center; gap: 15px; }

        .status-badge {
            font-size: 11px; padding: 4px 10px; border-radius: 20px; background: #333; 
            color: #888; display: flex; align-items: center; gap: 6px; border: 1px solid #444;
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #666; }
        .status-online .status-dot { background: #10b981; box-shadow: 0 0 5px #10b981; }
        .status-online { color: #10b981; background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); }

        .btn-reset-icon {
            background: #ef4444; color: white; border: none; width: 40px; height: 40px;
            border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
        }
        .btn-reset-icon:hover { background: #dc2626; transform: scale(1.05); }
        .btn-reset-icon:active { transform: scale(0.95); }
        .btn-reset-icon svg { width: 20px; height: 20px; fill: currentColor; }

        .main-container {
            display: flex; flex: 1; gap: 20px; padding: 20px; 
            max-width: 1600px; margin: 0 auto; width: 100%;
        }
        .canvas-section {
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; position: relative;
        }
        .canvas-wrapper {
            background: #1a1a1a; border-radius: 12px; padding: 10px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); display: inline-block;
        }
        #mainCanvas {
            max-width: 100%; max-height: 80vh; border-radius: 4px; 
            cursor: crosshair; display: block; background: #000;
        }
        #mainCanvas { user-select: none; -webkit-user-select: none; }

        .control-section { width: 320px; display: flex; flex-direction: column; gap: 12px; }
        
        .step-button {
            width: 100%; padding: 15px; border: none; border-radius: 8px; 
            font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; 
            color: white; text-transform: uppercase; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .step-button:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; box-shadow: none; }
        .step-button:not(:disabled):hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        .step-sam { background: #8b5cf6; } 
        .step-ext-send { background: #0ea5e9; } 
        .step-ext-confirm { background: #059669; border: 1px solid #34d399; }
        .step-place { background: #f59e0b; } 
        .step-exec { background: #ec4899; } 

        .external-panel { background: rgba(255,255,255,0.05); border: 1px dashed #444; border-radius: 8px; padding: 10px; margin: 5px 0; }
        .external-panel h3 { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }

        .loading-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.85); padding: 25px; border-radius: 12px; display: none; 
            z-index: 100; text-align: center; border: 1px solid #333; min-width: 200px;
        }
        .spinner { width: 30px; height: 30px; border: 3px solid #333; border-top: 3px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .separator { text-align: center; color: #555; font-size: 11px; margin: 10px 0; position: relative; }
        .separator::before, .separator::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: #333; }
        .separator::before { left: 0; } .separator::after { right: 0; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>🎯 SAM3 Live Teleop</h1>
            <p class="header-instructions">
                <span class="highlight-pos">L-Click: Add Pos</span> | 
                <span class="highlight-neg">R-Click: Add Neg</span> | 
                Dbl-Click: Remove
            </p>
        </div>
        <div class="header-right">
            <div id="extServiceStatus" class="status-badge">
                <div class="status-dot"></div><span id="extStatusText">Checking...</span>
            </div>
            
            <button class="btn-reset-icon" id="btnReset" title="Reset to Live Stream">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
        </div>
    </div>

    <div class="main-container">
        <div class="canvas-section">
            <div class="canvas-wrapper">
                <canvas id="mainCanvas" oncontextmenu="return false;"></canvas>
            </div>
            <div class="loading-overlay" id="loading">
                <div class="spinner"></div>
                <div id="loadingText">Processing...</div>
                <div id="loadingSubText" style="font-size: 12px; color: #888; margin-top: 5px;"></div>
            </div>
        </div>

        <div class="control-section">
            <button class="step-button step-sam" id="btnGenerateMask" disabled>Segment View (SAM3)</button>

            <div class="separator">OR USE EXTERNAL</div>

            <div class="external-panel">
                <h3>External Model</h3>
                <button class="step-button step-ext-send" id="btnSendExternal" disabled>Send View</button>
                <button class="step-button step-ext-confirm" id="btnConfirmExternal" style="display:none; margin-top:10px;">Confirm Mask</button>
            </div>

            <div class="separator">ACTION</div>

            <button class="step-button step-place" id="btnSelectPlace" disabled>Select Place Goal</button>
            <button class="step-button step-exec" id="btnExecuteGrasp" disabled>Execute Grasp</button>
        </div>
    </div>

    <script>
        const state = {
            step: 0, 
            pollingInterval: null,
            maskPollingInterval: null,
            points: [],
            labels: [],
            externalServiceOnline: false,
            clickTimer: null
        };

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        
        const btns = {
            mask: document.getElementById('btnGenerateMask'),
            sendExt: document.getElementById('btnSendExternal'),
            confirmExt: document.getElementById('btnConfirmExternal'),
            place: document.getElementById('btnSelectPlace'),
            execute: document.getElementById('btnExecuteGrasp'),
            reset: document.getElementById('btnReset')
        };

        canvas.width = 640; canvas.height = 480;
        drawPlaceholder("Waiting for video stream...");
        checkExternalHealth();
        state.pollingInterval = setInterval(pollVideoFrame, 50);

        async function checkExternalHealth() {
            const badge = document.getElementById('extServiceStatus');
            const text = document.getElementById('extStatusText');
            try {
                const res = await fetch('/external/health');
                const data = await res.json();
                if (data.status === 'online') {
                    badge.className = 'status-badge status-online'; text.innerText = "Ext Online";
                    state.externalServiceOnline = true;
                } else throw new Error();
            } catch (e) {
                badge.className = 'status-badge status-offline'; text.innerText = "Ext Offline";
                state.externalServiceOnline = false;
            }
            updateUI();
        }

        let lastFrameData = null;
        async function pollVideoFrame() {
            try {
                const res = await fetch('/get_frame');
                const data = await res.json();
                if (data.success && data.frame_data) {
                    if (lastFrameData !== data.frame_data || state.points.length > 0) {
                        renderImage(data.frame_data);
                        lastFrameData = data.frame_data;
                    }
                }
            } catch (e) { console.error(e); }
        }

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (state.step !== 0 && state.step !== 2) return;
            const coords = getCanvasCoordinates(e);

            if (state.step === 2) {
                handlePlaceSelection(coords.x, coords.y);
                return;
            }

            if (state.clickTimer === null) {
                state.clickTimer = setTimeout(() => {
                    state.clickTimer = null;
                    const label = e.button === 2 ? 0 : 1; 
                    state.points.push([coords.x, coords.y]);
                    state.labels.push(label);
                    if (lastFrameData) renderImage(lastFrameData);
                    updateUI();
                }, 250); 
            }
        });

        canvas.addEventListener('dblclick', (e) => {
            if (state.step !== 0) return;
            clearTimeout(state.clickTimer); state.clickTimer = null;
            const coords = getCanvasCoordinates(e);
            const clickedIndex = state.points.findIndex(p => Math.hypot(p[0]-coords.x, p[1]-coords.y) < 20);
            if (clickedIndex >= 0) {
                state.points.splice(clickedIndex, 1);
                state.labels.splice(clickedIndex, 1);
                if (lastFrameData) renderImage(lastFrameData);
                updateUI();
            }
        });

        btns.mask.addEventListener('click', async () => {
            setLoading(true, "Capturing & Segmenting...", "Freezing view...");
            try {
                const res = await fetch('/predict_mask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ points: state.points, labels: state.labels })
                });
                const data = await res.json();
                if (data.success) {
                    state.step = 1; 
                    updateUI();
                } else throw new Error(data.error);
            } catch (e) { alert("Error: " + e.message); }
            finally { setLoading(false); }
        });

        btns.sendExt.addEventListener('click', async () => {
            setLoading(true, "Sending...", "Freezing view...");
            try {
                const sendRes = await fetch('/external/send_image', { method: 'POST' });
                if (!sendRes.ok) throw new Error("Failed to send");
                setLoading(true, "Waiting for External Mask...", "Polling...");
                startMaskPolling();
            } catch (e) { alert(e.message); setLoading(false); }
        });

        function startMaskPolling() {
            let attempts = 0;
            if (state.maskPollingInterval) clearInterval(state.maskPollingInterval);
            state.maskPollingInterval = setInterval(async () => {
                attempts++;
                try {
                    const res = await fetch('/external/receive_mask?confirm=false');
                    const data = await res.json();
                    if (data.success && data.preview) {
                        clearInterval(state.maskPollingInterval);
                        state.step = 1; 
                        btns.sendExt.style.display = 'none';
                        btns.confirmExt.style.display = 'block';
                        setLoading(false);
                        updateUI();
                    } else if (attempts >= 60) {
                        clearInterval(state.maskPollingInterval);
                        setLoading(false); alert("Timeout.");
                    }
                } catch (e) { }
            }, 500);
        }

        btns.confirmExt.addEventListener('click', async () => {
            setLoading(true, "Confirming...");
            try { await fetch('/external/receive_mask?confirm=true'); updateUI(); } 
            catch (e) { alert("Failed"); } finally { setLoading(false); }
        });

        btns.place.addEventListener('click', () => { state.step = 2; updateUI(); });

        async function handlePlaceSelection(x, y) {
            setLoading(true, "Recording Target...");
            try {
                await fetch('/select_place', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ x, y })
                });
                state.step = 3; 
                if (lastFrameData) renderImage(lastFrameData); 
                ctx.strokeStyle = "yellow"; ctx.lineWidth = 3;
                ctx.strokeRect(x-10, y-10, 20, 20);
                updateUI();
            } finally { setLoading(false); }
        }

        // --- UPDATED EXECUTE HANDLER (No Alert, No Reset) ---
        btns.execute.addEventListener('click', async () => {
            setLoading(true, "Calculating Grasp...", "Syncing with Point Cloud...");
            try {
                const res = await fetch('/execute_grasp', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    console.log(`Command Sent! ID: ${data.action_id}`);
                    // Optional: temporary feedback on button
                    const origText = btns.execute.innerText;
                    btns.execute.innerText = "✅ Sent!";
                    setTimeout(() => btns.execute.innerText = origText, 2000);
                } else {
                    alert(`❌ Failed: ${data.error}`);
                }
            } catch (e) { alert("Network Error"); }
            finally { setLoading(false); }
        });

        btns.reset.addEventListener('click', resetState);

        async function resetState() {
            setLoading(true, "Resetting...");
            try {
                await fetch('/reset', { method: 'POST' });
                state.step = 0;
                state.points = []; state.labels = [];
                if (state.maskPollingInterval) clearInterval(state.maskPollingInterval);
                btns.sendExt.style.display = 'block';
                btns.confirmExt.style.display = 'none';
                updateUI();
            } catch(e) { console.error(e); } 
            finally { setLoading(false); }
        }

        function renderImage(b64) {
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width; canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                if (state.step === 0) drawPoints();
            };
            img.src = b64;
        }

        function drawPoints() {
            state.points.forEach((p, i) => {
                ctx.beginPath(); ctx.arc(p[0], p[1], 6, 0, Math.PI*2);
                ctx.fillStyle = state.labels[i] === 1 ? '#10b981' : '#ef4444';
                ctx.fill(); ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
            });
        }

        function drawPlaceholder(text) {
            ctx.fillStyle = "#111"; ctx.fillRect(0,0,640,480);
            ctx.fillStyle = "#555"; ctx.font = "20px Arial";
            ctx.textAlign = "center"; ctx.fillText(text, 320, 240);
        }

        function updateUI() {
            btns.mask.disabled = state.step !== 0 || state.points.length === 0;
            btns.sendExt.disabled = state.step !== 0 || !state.externalServiceOnline;
            const maskExists = state.step >= 1;
            btns.place.disabled = !maskExists;
            btns.execute.disabled = !maskExists;
            canvas.style.cursor = state.step === 2 ? 'target' : 'crosshair';
        }

        function setLoading(active, text="Processing...", subtext="") {
            loading.style.display = active ? 'block' : 'none';
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingSubText').innerText = subtext;
        }
    </script>
</body>
</html>
