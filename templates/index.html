<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAM3 Web GUI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .main-container {
            display: flex;
            flex: 1;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .canvas-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 600px;
        }

        .canvas-wrapper {
            position: relative;
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            display: inline-block;
        }

        #mainCanvas {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            cursor: crosshair;
            display: block;
            background: #000;
        }

        .control-section {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .step-button {
            width: 100%;
            padding: 18px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .step-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .step-button:hover::before {
            left: 100%;
        }

        .step-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .step-button:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .step-button:not(:disabled):active {
            transform: translateY(0);
        }

        .step-1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .step-2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .step-3 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .step-4 {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }

        .step-5 {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .step-6 {
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
            color: white;
        }

        .mode-selector {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid;
            border-radius: 8px;
            background: transparent;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .mode-btn.positive {
            border-color: #4ade80;
            color: #4ade80;
        }

        .mode-btn.positive.active {
            background: #4ade80;
            color: #0a0a0a;
        }

        .mode-btn.negative {
            border-color: #f87171;
            color: #f87171;
        }

        .mode-btn.negative.active {
            background: #f87171;
            color: #0a0a0a;
        }

        .download-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .download-btn {
            padding: 12px;
            border: 2px solid #4ade80;
            border-radius: 8px;
            background: transparent;
            color: #4ade80;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .download-btn:hover {
            background: #4ade80;
            color: #0a0a0a;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            margin-top: 8px;
            font-size: 14px;
            color: #a0a0a0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .point-indicator {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid white;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .point-indicator.positive {
            background: #4ade80;
        }

        .point-indicator.negative {
            background: #f87171;
        }

        .place-indicator {
            position: absolute;
            border: 2px solid #fbbf24;
            background: rgba(251, 191, 36, 0.2);
            pointer-events: none;
            box-sizing: border-box;
        }

        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
            }

            .control-section {
                width: 100%;
            }

            .canvas-section {
                min-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 SAM3 Web GUI</h1>
    </div>

    <div class="main-container">
        <!-- Left: Canvas Section -->
        <div class="canvas-section">
            <div class="canvas-wrapper">
                <canvas id="mainCanvas"></canvas>
            </div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing...</p>
            </div>
        </div>

        <!-- Right: Control Section -->
        <div class="control-section">
            <!-- Mode Selector -->
            <div class="status-info" style="margin-bottom: 16px;">
                <div style="margin-bottom: 8px; font-weight: 600;">Mask Source Mode:</div>
                <div class="mode-selector" id="maskModeSelector">
                    <button class="mode-btn positive" id="btnModeSam3" style="flex: 1;">SAM3</button>
                    <button class="mode-btn negative" id="btnModeExternal" style="flex: 1;">External</button>
                </div>
            </div>

            <!-- Step 1: Start Video -->
            <button class="step-button step-1" id="btnStartVideo">
                Step 1: Start Video
            </button>

            <!-- Step 2: Stop Video -->
            <button class="step-button step-2" id="btnStopVideo" disabled>
                Step 2: Stop Video
            </button>
            <div class="status-info" id="statusVideo" style="display: none;">
                Video stopped. Frame captured.
            </div>

            <!-- Step 3: Add Points (SAM3 mode only) -->
            <button class="step-button step-3" id="btnAddPoints" disabled style="display: none;">
                Step 3: Add Points
            </button>
            <div class="mode-selector" id="modeSelector" style="display: none;">
                <button class="mode-btn positive active" id="btnPositive">Positive</button>
                <button class="mode-btn negative" id="btnNegative">Negative</button>
            </div>
            <div class="status-info" id="statusPoints" style="display: none;">
                Points: <span id="pointCount">0</span>
            </div>

            <!-- Step 4A: SAM3 Generate Mask -->
            <button class="step-button step-4" id="btnGenerateMask" disabled style="display: none;">
                Step 4: Generate Mask (SAM3)
            </button>
            
            <!-- Step 4B: External Mode Controls -->
            <div id="externalModeControls" style="display: none;">
                <button class="step-button step-4" id="btnSendImage" disabled>
                    Step 4A: Send Image
                </button>
                <div class="status-info" id="statusSendImage" style="display: none;">
                    Image sent. Waiting for mask...
                </div>
                <button class="step-button step-4" id="btnReceiveMask" disabled>
                    Step 4B: Confirm Mask
                </button>
                <div class="status-info" id="statusReceiveMask" style="display: none;">
                    Waiting for mask from external service...
                </div>
            </div>
            
            <div class="status-info" id="statusMask" style="display: none;">
                Mask generated successfully.
            </div>

            <!-- Step 5: Select Place Point -->
            <button class="step-button step-5" id="btnSelectPlace" disabled>
                Step 5: Select Place Point
            </button>
            <div class="status-info" id="statusPlace" style="display: none;">
                Click on overlay to select placement point (uses current mask if available).
            </div>

            <!-- Step 6: Download -->
            <button class="step-button step-6" id="btnDownload" disabled>
                Step 6: Download
            </button>
            <div class="download-options" id="downloadOptions" style="display: none;">
                <button class="download-btn" id="btnDownloadOverlay">Download Overlay</button>
                <button class="download-btn" id="btnDownloadMask">Download Mask</button>
                <button class="download-btn" id="btnDownloadPlace" style="display: none;">Download Place Mask</button>
            </div>
        </div>
    </div>

    <script>
        // State management
        const state = {
            step: 0, // 0: initial, 1: video started, 2: video stopped, 3: points added, 4: mask generated, 5: place selected
            videoRunning: false,
            videoInterval: null,
            currentImage: null,
            currentOverlay: null,
            currentMask: null,
            placeMask: null,
            points: [],
            labels: [],
            currentMode: 'positive', // 'positive' or 'negative'
            selectedPlace: null,
            imageSize: { width: 0, height: 0 },
            canvasScale: 1,
            maskSourceMode: 'sam3' // 'sam3' or 'external'
        };

        // DOM elements
        const mainCanvas = document.getElementById('mainCanvas');
        const ctx = mainCanvas.getContext('2d');
        const loading = document.getElementById('loading');

        // Buttons
        const btnStartVideo = document.getElementById('btnStartVideo');
        const btnStopVideo = document.getElementById('btnStopVideo');
        const btnAddPoints = document.getElementById('btnAddPoints');
        const btnGenerateMask = document.getElementById('btnGenerateMask');
        const btnSelectPlace = document.getElementById('btnSelectPlace');
        const btnDownload = document.getElementById('btnDownload');
        const btnPositive = document.getElementById('btnPositive');
        const btnNegative = document.getElementById('btnNegative');
        const btnDownloadOverlay = document.getElementById('btnDownloadOverlay');
        const btnDownloadMask = document.getElementById('btnDownloadMask');
        const btnDownloadPlace = document.getElementById('btnDownloadPlace');
        const btnModeSam3 = document.getElementById('btnModeSam3');
        const btnModeExternal = document.getElementById('btnModeExternal');
        const btnSendImage = document.getElementById('btnSendImage');
        const btnReceiveMask = document.getElementById('btnReceiveMask');
        const externalModeControls = document.getElementById('externalModeControls');
        const statusSendImage = document.getElementById('statusSendImage');
        const statusReceiveMask = document.getElementById('statusReceiveMask');
        
        // External mode polling for preview
        let externalPreviewInterval = null;

        // Status elements
        const statusVideo = document.getElementById('statusVideo');
        const statusPoints = document.getElementById('statusPoints');
        const statusMask = document.getElementById('statusMask');
        const statusPlace = document.getElementById('statusPlace');
        const pointCount = document.getElementById('pointCount');
        const modeSelector = document.getElementById('modeSelector');
        const downloadOptions = document.getElementById('downloadOptions');

        // Initialize canvas
        function initCanvas() {
            mainCanvas.width = 800;
            mainCanvas.height = 600;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
            ctx.fillStyle = '#666';
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Click "Step 1: Start Video" to begin', mainCanvas.width / 2, mainCanvas.height / 2);
        }

        // Update button states based on current step
        function updateButtonStates() {
            btnStartVideo.disabled = state.step >= 1;
            btnStopVideo.disabled = state.step < 1;
            
            if (state.maskSourceMode === 'sam3') {
                btnAddPoints.disabled = state.step < 2;
                btnGenerateMask.disabled = state.step < 3 || state.points.length === 0;
            } else {
                btnSendImage.disabled = state.step < 2;
                btnReceiveMask.disabled = state.step < 2;
            }
            
            btnSelectPlace.disabled = state.step < 4;
            btnDownload.disabled = state.step < 4;
        }

        // Mode selection handlers
        btnModeSam3.addEventListener('click', () => {
            state.maskSourceMode = 'sam3';
            btnModeSam3.classList.add('active');
            btnModeExternal.classList.remove('active');
            btnAddPoints.style.display = 'block';
            btnGenerateMask.style.display = 'block';
            externalModeControls.style.display = 'none';
            // Reset mask-related state when switching modes
            if (state.step < 4) {
                state.step = Math.min(state.step, 2);
                state.currentMask = null;
                state.currentOverlay = null;
                state.points = [];
                state.labels = [];
                statusMask.style.display = 'none';
                statusSendImage.style.display = 'none';
                statusReceiveMask.style.display = 'none';
                downloadOptions.style.display = 'none';
                // Stop external preview polling
                if (externalPreviewInterval) {
                    clearInterval(externalPreviewInterval);
                    externalPreviewInterval = null;
                }
            }
            updateButtonStates();
        });

        btnModeExternal.addEventListener('click', () => {
            state.maskSourceMode = 'external';
            btnModeExternal.classList.add('active');
            btnModeSam3.classList.remove('active');
            btnAddPoints.style.display = 'none';
            btnGenerateMask.style.display = 'none';
            externalModeControls.style.display = 'block';
            // Reset mask-related state when switching modes
            if (state.step < 4) {
                state.step = Math.min(state.step, 2);
                state.currentMask = null;
                state.currentOverlay = null;
                state.points = [];
                state.labels = [];
                statusMask.style.display = 'none';
                statusSendImage.style.display = 'none';
                statusReceiveMask.style.display = 'none';
                downloadOptions.style.display = 'none';
                // Stop external preview polling
                if (externalPreviewInterval) {
                    clearInterval(externalPreviewInterval);
                    externalPreviewInterval = null;
                }
            }
            updateButtonStates();
        });

        // Initialize mode to SAM3
        btnModeSam3.classList.add('active');

        // External mode: Send Image
        btnSendImage.addEventListener('click', async () => {
            loading.style.display = 'block';

            try {
                const response = await fetch('/external/send_image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();
                if (data.success) {
                    statusSendImage.style.display = 'block';
                    statusReceiveMask.style.display = 'block';
                    
                    // Start polling for preview mask
                    startExternalPreviewPolling();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error sending image:', error);
                alert('Failed to send image: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        });

        // External mode: Poll for preview mask
        function startExternalPreviewPolling() {
            // Clear existing interval
            if (externalPreviewInterval) {
                clearInterval(externalPreviewInterval);
            }
            
            // Poll every 2 seconds for preview
            externalPreviewInterval = setInterval(async () => {
                try {
                    const response = await fetch('/external/receive_mask');
                    const data = await response.json();
                    
                    if (data.success && data.preview) {
                        // Update preview display (don't set state.step or lock)
                        const img = new Image();
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);
                        };
                        img.src = data.overlay_data;
                        
                        // Update status
                        statusReceiveMask.textContent = 'Mask received. Click "Confirm Mask" to use it.';
                    } else if (data.success && data.locked) {
                        // Already confirmed, stop polling
                        clearInterval(externalPreviewInterval);
                        externalPreviewInterval = null;
                    }
                } catch (error) {
                    // Silently ignore errors during polling
                    console.debug('Preview polling error:', error);
                }
            }, 2000); // Poll every 2 seconds
        }

        // External mode: Confirm Mask
        btnReceiveMask.addEventListener('click', async () => {
            loading.style.display = 'block';

            try {
                // Stop polling
                if (externalPreviewInterval) {
                    clearInterval(externalPreviewInterval);
                    externalPreviewInterval = null;
                }

                const response = await fetch('/external/receive_mask?confirm=true');
                const data = await response.json();
                
                if (data.success) {
                    state.currentOverlay = data.overlay_data;
                    state.currentMask = data.mask_data;
                    state.step = 4;
                    updateButtonStates();
                    statusMask.style.display = 'block';
                    statusReceiveMask.style.display = 'none';
                    downloadOptions.style.display = 'flex';

                    // Display overlay
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);
                    };
                    img.src = data.overlay_data;
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error confirming mask:', error);
                alert('Failed to confirm mask: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        });

        // Step 1: Start Video
        btnStartVideo.addEventListener('click', async () => {
            state.videoRunning = true;
            state.step = 1;
            updateButtonStates();
            loading.style.display = 'block';

            // Start video stream
            const startVideo = async () => {
                try {
                    const response = await fetch('/start_video', { method: 'POST' });
                    const data = await response.json();
                    
                    if (data.success) {
                        const img = new Image();
                        img.onload = () => {
                            // Calculate scale to fit canvas
                            const maxWidth = 800;
                            const maxHeight = 600;
                            const scaleX = maxWidth / img.width;
                            const scaleY = maxHeight / img.height;
                            state.canvasScale = Math.min(scaleX, scaleY, 1);
                            
                            mainCanvas.width = img.width * state.canvasScale;
                            mainCanvas.height = img.height * state.canvasScale;
                            
                            ctx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);
                            loading.style.display = 'none';
                        };
                        img.src = data.frame_data;
                    }
                } catch (error) {
                    console.error('Error starting video:', error);
                    loading.style.display = 'none';
                }
            };

            await startVideo();

            // Continue fetching frames
            state.videoInterval = setInterval(async () => {
                if (!state.videoRunning) {
                    clearInterval(state.videoInterval);
                    state.videoInterval = null;
                    return;
                }
                try {
                    const response = await fetch('/start_video', { method: 'POST' });
                    const data = await response.json();
                    if (data.success) {
                        const img = new Image();
                        img.onload = () => {
                            if (state.videoRunning) {
                                ctx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);
                            }
                        };
                        img.src = data.frame_data;
                    }
                } catch (error) {
                    console.error('Error fetching frame:', error);
                }
            }, 100); // Update every 100ms
        });

        // Step 2: Stop Video
        btnStopVideo.addEventListener('click', async () => {
            state.videoRunning = false;
            if (state.videoInterval) {
                clearInterval(state.videoInterval);
                state.videoInterval = null;
            }

            loading.style.display = 'block';

            // Capture current frame from canvas
            const canvasData = mainCanvas.toDataURL('image/jpeg');

            try {
                const response = await fetch('/stop_video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ frame_data: canvasData })
                });

                const data = await response.json();
                if (data.success) {
                    state.currentImage = data.image_data;
                    state.imageSize = data.image_size;
                    state.step = 2;
                    // Reset mask-related state for new image
                    state.currentMask = null;
                    state.currentOverlay = null;
                    state.points = [];
                    state.labels = [];
                    statusMask.style.display = 'none';
                    statusSendImage.style.display = 'none';
                    statusReceiveMask.style.display = 'none';
                    downloadOptions.style.display = 'none';
                    // Stop external preview polling
                    if (externalPreviewInterval) {
                        clearInterval(externalPreviewInterval);
                        externalPreviewInterval = null;
                    }
                    updateButtonStates();
                    statusVideo.style.display = 'block';
                    loading.style.display = 'none';

                    // Display captured image
                    const img = new Image();
                    img.onload = () => {
                        // Recalculate scale if needed
                        const maxWidth = 800;
                        const maxHeight = 600;
                        const scaleX = maxWidth / img.width;
                        const scaleY = maxHeight / img.height;
                        state.canvasScale = Math.min(scaleX, scaleY, 1);
                        
                        mainCanvas.width = img.width * state.canvasScale;
                        mainCanvas.height = img.height * state.canvasScale;
                        ctx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);
                    };
                    img.src = data.image_data;
                } else {
                    alert('Error: ' + (data.error || 'Failed to stop video'));
                    loading.style.display = 'none';
                }
            } catch (error) {
                console.error('Error stopping video:', error);
                alert('Failed to stop video: ' + error.message);
                loading.style.display = 'none';
            }
        });

        // Step 3: Add Points
        btnAddPoints.addEventListener('click', () => {
            modeSelector.style.display = 'flex';
            statusPoints.style.display = 'block';
            state.step = 3;
            updateButtonStates();
        });

        // Mode selection
        btnPositive.addEventListener('click', () => {
            state.currentMode = 'positive';
            btnPositive.classList.add('active');
            btnNegative.classList.remove('active');
        });

        btnNegative.addEventListener('click', () => {
            state.currentMode = 'negative';
            btnNegative.classList.add('active');
            btnPositive.classList.remove('active');
        });

        // Canvas click for points
        mainCanvas.addEventListener('click', (e) => {
            if (state.step < 3) return;

            const rect = mainCanvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / state.canvasScale;
            const y = (e.clientY - rect.top) / state.canvasScale;

            // Check if clicking on existing point
            const pointIndex = findPointAt(x, y);
            if (pointIndex !== -1) {
                // Remove point
                state.points.splice(pointIndex, 1);
                state.labels.splice(pointIndex, 1);
            } else {
                // Add point
                state.points.push([x, y]);
                state.labels.push(state.currentMode === 'positive' ? 1 : 0);
            }

            updatePointDisplay();
            updateButtonStates();
        });

        function findPointAt(x, y) {
            const threshold = 15;
            for (let i = 0; i < state.points.length; i++) {
                const dx = state.points[i][0] - x;
                const dy = state.points[i][1] - y;
                if (Math.sqrt(dx * dx + dy * dy) < threshold) {
                    return i;
                }
            }
            return -1;
        }

        function updatePointDisplay() {
            // Redraw canvas
            if (state.currentImage) {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);
                    
                    // Draw points
                    state.points.forEach((point, i) => {
                        const x = point[0] * state.canvasScale;
                        const y = point[1] * state.canvasScale;
                        const label = state.labels[i];
                        
                        ctx.beginPath();
                        ctx.arc(x, y, 8, 0, 2 * Math.PI);
                        ctx.fillStyle = label === 1 ? '#4ade80' : '#f87171';
                        ctx.fill();
                        ctx.strokeStyle = 'white';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    });
                };
                img.src = state.currentImage;
            }

            pointCount.textContent = state.points.length;
        }

        // Step 4: Generate Mask (SAM3 mode only)
        btnGenerateMask.addEventListener('click', async () => {
            if (state.points.length === 0) {
                alert('Please add at least one point first.');
                return;
            }

            loading.style.display = 'block';

            try {
                const response = await fetch('/sam3/predict_mask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        points: state.points,
                        labels: state.labels
                    })
                });

                const data = await response.json();
                if (data.success) {
                    state.currentOverlay = data.overlay_data;
                    state.currentMask = data.mask_data;
                    state.step = 4;
                    updateButtonStates();
                    statusMask.style.display = 'block';
                    downloadOptions.style.display = 'flex';

                    // Display overlay
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);
                    };
                    img.src = data.overlay_data;
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error generating mask:', error);
                alert('Failed to generate mask: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        });

        // Step 5: Select Place Point
        btnSelectPlace.addEventListener('click', () => {
            statusPlace.style.display = 'block';
            state.step = 5;
            updateButtonStates();
        });

        // Canvas click for place point (on overlay)
        mainCanvas.addEventListener('click', async (e) => {
            if (state.step !== 5 || !state.currentOverlay) return;

            const rect = mainCanvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) / state.canvasScale;
            const clickY = (e.clientY - rect.top) / state.canvasScale;

            // Calculate 10x10 region (centered on click)
            const regionX = Math.max(0, Math.min(Math.floor(clickX - 5), state.imageSize.width - 10));
            const regionY = Math.max(0, Math.min(Math.floor(clickY - 5), state.imageSize.height - 10));

            // Toggle selection
            if (state.selectedPlace && state.selectedPlace.x === regionX && state.selectedPlace.y === regionY) {
                state.selectedPlace = null;
            } else {
                state.selectedPlace = { x: regionX, y: regionY };
            }

            // Update display
            if (state.currentOverlay) {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);
                    
                    // Draw place indicator
                    if (state.selectedPlace) {
                        const x = state.selectedPlace.x * state.canvasScale;
                        const y = state.selectedPlace.y * state.canvasScale;
                        const size = 10 * state.canvasScale;
                        
                        ctx.strokeStyle = '#fbbf24';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x, y, size, size);
                        ctx.fillStyle = 'rgba(251, 191, 36, 0.2)';
                        ctx.fillRect(x, y, size, size);
                    }
                };
                img.src = state.currentOverlay;
            }

            // Send to backend
            if (state.selectedPlace) {
                try {
                    const response = await fetch('/select_place', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            x: state.selectedPlace.x,
                            y: state.selectedPlace.y
                        })
                    });

                    const data = await response.json();
                    if (data.success) {
                        state.placeMask = data.mask_data;
                        btnDownloadPlace.style.display = 'block';
                    }
                } catch (error) {
                    console.error('Error selecting place:', error);
                }
            } else {
                btnDownloadPlace.style.display = 'none';
            }
        });

        // Step 6: Download
        btnDownload.addEventListener('click', () => {
            // Download options are already visible
        });

        // Download buttons
        btnDownloadOverlay.addEventListener('click', async () => {
            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'overlay' })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'overlay_output.png';
                    a.click();
                    window.URL.revokeObjectURL(url);
                }
            } catch (error) {
                console.error('Error downloading overlay:', error);
            }
        });

        btnDownloadMask.addEventListener('click', async () => {
            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'mask' })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'mask_output.png';
                    a.click();
                    window.URL.revokeObjectURL(url);
                }
            } catch (error) {
                console.error('Error downloading mask:', error);
            }
        });

        btnDownloadPlace.addEventListener('click', async () => {
            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'place_mask' })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'place_mask.png';
                    a.click();
                    window.URL.revokeObjectURL(url);
                }
            } catch (error) {
                console.error('Error downloading place mask:', error);
            }
        });

        // Initialize
        initCanvas();
        updateButtonStates();
    </script>
</body>
</html>
