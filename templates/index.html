<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAM3 Robot Teleop</title>
    <style>
        /* --- Styles --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header h1 { color: #fff; font-size: 24px; }
        .main-container {
            display: flex;
            flex: 1;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }
        .canvas-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .canvas-wrapper {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: inline-block;
        }
        #mainCanvas {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 4px;
            cursor: crosshair;
            display: block;
            background: #000;
        }
        .control-section {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .step-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            color: white;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .step-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }
        .step-button:not(:disabled):hover { transform: translateY(-2px); }
        
        .step-1 { background: #3b82f6; } /* Blue */
        .step-2 { background: #ef4444; } /* Red */
        .step-3 { background: #8b5cf6; } /* Purple */
        .step-4 { background: #10b981; } /* Green */
        .step-5 { background: #f59e0b; } /* Orange */
        .step-6 { background: #ec4899; } /* Pink/Magenta for Action */

        .loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 25px;
            border-radius: 12px;
            display: none;
            z-index: 100;
            text-align: center;
            border: 1px solid #333;
        }
        .spinner {
            width: 30px; height: 30px;
            border: 3px solid #333;
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Helpers */
        .mode-selector { display: flex; gap: 10px; margin-bottom: 5px; }
        .mode-btn { 
            flex: 1; padding: 10px; border: 1px solid #444; 
            background: transparent; color: #888; cursor: pointer; border-radius: 6px;
            font-weight: bold;
        }
        .mode-btn.active.positive { background: #10b981; color: white; border-color: #10b981; }
        .mode-btn.active.negative { background: #ef4444; color: white; border-color: #ef4444; }
        
        .download-row { display: flex; gap: 8px; margin-top: 10px; border-top: 1px solid #333; padding-top: 15px; }
        .download-btn { 
            flex: 1; padding: 8px; background: #222; border: 1px solid #444; 
            color: #aaa; cursor: pointer; border-radius: 6px; font-size: 12px;
        }
        .download-btn:hover { background: #333; color: white; }
        .section-label { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px;}
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 SAM3 Robot Teleop</h1>
    </div>

    <div class="main-container">
        <div class="canvas-section">
            <div class="canvas-wrapper">
                <canvas id="mainCanvas"></canvas>
            </div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div id="loadingText">Processing...</div>
            </div>
        </div>

        <div class="control-section">
            <button class="step-button step-1" id="btnStartVideo">1. Start Stream</button>

            <button class="step-button step-2" id="btnStopVideo" disabled>2. Stop & Capture</button>

            <button class="step-button step-3" id="btnAddPoints" disabled>3. Annotate Points</button>
            <div class="mode-selector" id="modeSelector" style="display: none;">
                <button class="mode-btn positive active" id="btnPositive">Positive (+)</button>
                <button class="mode-btn negative" id="btnNegative">Negative (-)</button>
            </div>

            <button class="step-button step-4" id="btnGenerateMask" disabled>4. Segment</button>

            <button class="step-button step-5" id="btnSelectPlace" disabled>5. Select Place</button>

            <button class="step-button step-6" id="btnExecuteGrasp" disabled>6. Execute Grasp</button>
            
            <div id="downloadOptions" style="display: none;">
                <div class="section-label">Debug / Export</div>
                <div class="download-row">
                    <button class="download-btn" id="dlOverlay">Save Overlay</button>
                    <button class="download-btn" id="dlMask">Save Mask</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        const state = {
            step: 0,
            pollingInterval: null,
            canvasScale: 1,
            points: [],
            labels: [],
            currentMode: 'positive',
            currentImage: null, 
            currentOverlay: null
        };

        // Elements
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        
        // Buttons
        const btns = {
            start: document.getElementById('btnStartVideo'),
            stop: document.getElementById('btnStopVideo'),
            points: document.getElementById('btnAddPoints'),
            mask: document.getElementById('btnGenerateMask'),
            place: document.getElementById('btnSelectPlace'),
            execute: document.getElementById('btnExecuteGrasp'), // Changed from Download
            pos: document.getElementById('btnPositive'),
            neg: document.getElementById('btnNegative')
        };

        // Init Canvas
        canvas.width = 640;
        canvas.height = 480;
        ctx.fillStyle = "#111";
        ctx.fillRect(0,0,640,480);
        ctx.fillStyle = "#555";
        ctx.font = "20px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Ready", 320, 240);

        // --- Step 1: Start Video (Polling Logic) ---
        btns.start.addEventListener('click', async () => {
            setLoading(true, "Starting Stream...");
            try {
                const res = await fetch('/start_video', { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    state.step = 1;
                    updateUI();
                    
                    if (state.pollingInterval) clearInterval(state.pollingInterval);
                    
                    state.pollingInterval = setInterval(async () => {
                        try {
                            const frameRes = await fetch('/get_frame');
                            const frameData = await frameRes.json();
                            
                            if (frameData.success && frameData.frame_data) {
                                renderImage(frameData.frame_data);
                            }
                        } catch (e) {
                            console.error("Polling error", e);
                        }
                    }, 40); 
                }
            } catch (e) {
                alert("Failed to start stream");
            } finally {
                setLoading(false);
            }
        });

        // --- Step 2: Stop Video (Capture & Upload) ---
        btns.stop.addEventListener('click', async () => {
            if (state.pollingInterval) clearInterval(state.pollingInterval);
            state.pollingInterval = null;

            setLoading(true, "Capturing & Loading Model...");

            try {
                await fetch('/stop_video', { method: 'POST' });

                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        alert("Canvas empty!"); 
                        setLoading(false); 
                        return;
                    }

                    const formData = new FormData();
                    formData.append('image', blob, 'capture.jpg');

                    const upRes = await fetch('/upload', { method: 'POST', body: formData });
                    const upData = await upRes.json();

                    if (upData.success) {
                        state.currentImage = upData.image_data;
                        renderImage(state.currentImage);
                        state.step = 2;
                        updateUI();
                    } else {
                        alert("Capture failed: " + upData.error);
                    }
                    setLoading(false);
                }, 'image/jpeg', 0.95);

            } catch (e) {
                console.error(e);
                alert("Error stopping stream");
                setLoading(false);
            }
        });

        // --- Step 3: Points ---
        btns.points.addEventListener('click', () => {
            state.step = 3;
            document.getElementById('modeSelector').style.display = 'flex';
            updateUI();
        });

        canvas.addEventListener('mousedown', (e) => {
            if (state.step < 3) return;
            
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            // Step 3: Add Annotation Points
            if (state.step === 3) {
                const clickedIndex = state.points.findIndex(p => {
                    const dx = p[0] - x;
                    const dy = p[1] - y;
                    return Math.sqrt(dx*dx + dy*dy) < 15;
                });

                if (clickedIndex >= 0) {
                    state.points.splice(clickedIndex, 1);
                    state.labels.splice(clickedIndex, 1);
                } else {
                    state.points.push([x, y]);
                    state.labels.push(state.currentMode === 'positive' ? 1 : 0);
                }
                redrawCanvas();
            }

            // Step 5: Select Place Region
            if (state.step === 5) {
                handlePlaceSelection(x, y);
            }
        });

        // --- Step 4: Generate Mask ---
        btns.mask.addEventListener('click', async () => {
            if (state.points.length === 0) return alert("Add points first!");
            setLoading(true, "Segmenting...");
            
            try {
                const res = await fetch('/predict_mask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ points: state.points, labels: state.labels })
                });
                const data = await res.json();
                
                if (data.success) {
                    state.currentOverlay = data.overlay_data;
                    renderImage(data.overlay_data);
                    state.step = 4;
                    updateUI();
                } else {
                    alert("Error: " + data.error);
                }
            } catch (e) {
                alert("Segmentation failed");
            } finally {
                setLoading(false);
            }
        });

        // --- Step 5: Place Selection ---
        btns.place.addEventListener('click', () => {
            state.step = 5;
            updateUI();
        });

        async function handlePlaceSelection(x, y) {
            setLoading(true, "Recording Place Location...");
            try {
                const res = await fetch('/select_place', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ x: x, y: y })
                });
                const data = await res.json();
                if (data.success) {
                    redrawCanvas();
                    ctx.strokeStyle = "yellow";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x - 5, y - 5, 10, 10);
                    state.step = 6; 
                    updateUI();
                }
            } catch(e) {
                console.error(e);
            } finally {
                setLoading(false);
            }
        }

        // --- Step 6: Execute Grasp (Changed from Download) ---
        btns.execute.addEventListener('click', async () => {
            // Note: We show a specific message because backend waits for PC
            setLoading(true, "Syncing with Env & Sending Action...");
            
            try {
                const res = await fetch('/execute_grasp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const data = await res.json();
                
                if (data.success) {
                    alert(`✅ Command Sent!\nAction ID: ${data.action_id}`);
                } else {
                    alert(`❌ Failed: ${data.error}`);
                }
            } catch (e) {
                alert("Network Error during execution request.");
            } finally {
                setLoading(false);
            }
        });


        // --- Helpers ---

        function renderImage(base64Str) {
            const img = new Image();
            img.onload = () => {
                if (canvas.width !== img.width || canvas.height !== img.height) {
                    canvas.width = img.width;
                    canvas.height = img.height;
                }
                ctx.drawImage(img, 0, 0);
                if (state.step >= 3) drawPoints();
            };
            img.src = base64Str;
        }

        function redrawCanvas() {
            const src = (state.step >= 4 && state.currentOverlay) ? state.currentOverlay : state.currentImage;
            if (src) renderImage(src);
        }

        function drawPoints() {
            state.points.forEach((p, i) => {
                ctx.beginPath();
                ctx.arc(p[0], p[1], 5, 0, Math.PI * 2);
                ctx.fillStyle = state.labels[i] === 1 ? '#10b981' : '#ef4444'; 
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.stroke();
            });
        }

        function updateUI() {
            Object.values(btns).forEach(b => b.disabled = true);
            
            if (state.step === 0 || state.step >= 2) btns.start.disabled = false;
            if (state.step === 1) btns.stop.disabled = false;
            if (state.step >= 2) btns.points.disabled = false;
            if (state.step >= 3 && state.points.length > 0) btns.mask.disabled = false;
            if (state.step >= 4) btns.place.disabled = false;
            if (state.step >= 4) btns.execute.disabled = false; // Enable action after mask/place

            btns.pos.disabled = false;
            btns.neg.disabled = false;

            // Show Debug options only after mask is generated
            const dlRow = document.getElementById('downloadOptions');
            dlRow.style.display = (state.step >= 4) ? 'block' : 'none';
        }

        function setLoading(isActive, text="Processing...") {
            loading.style.display = isActive ? 'block' : 'none';
            document.getElementById('loadingText').innerText = text;
        }

        // Mode Toggles
        btns.pos.onclick = () => {
            state.currentMode = 'positive';
            btns.pos.classList.add('active');
            btns.neg.classList.remove('active');
        };
        btns.neg.onclick = () => {
            state.currentMode = 'negative';
            btns.neg.classList.add('active');
            btns.pos.classList.remove('active');
        };

        // Legacy Downloads
        document.getElementById('dlOverlay').onclick = () => download('overlay');
        document.getElementById('dlMask').onclick = () => download('mask');

        async function download(type) {
            const res = await fetch('/download', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ type })
            });
            if (res.ok) {
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = type + '.png';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } else {
                alert("Download failed");
            }
        }

        updateUI();
    </script>
</body>
</html>
