<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        /* --- Styles --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0a; color: #e0e0e0;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 10px 20px; 
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); height: 70px;
        }
        
        .header-left { display: flex; flex-direction: column; justify-content: center; }
        .header h1 { color: #fff; font-size: 20px; margin: 0; line-height: 1.2; }
        .header-instructions { font-size: 13px; color: #aaa; margin-top: 4px; }
        .highlight-pos { color: #10b981; font-weight: bold; }
        .highlight-neg { color: #ef4444; font-weight: bold; }
        .highlight-place { color: #3b82f6; font-weight: bold; }

        .header-right { display: flex; align-items: center; gap: 15px; }

        .status-badge {
            font-size: 11px; padding: 4px 10px; border-radius: 20px; background: #333; 
            color: #888; display: flex; align-items: center; gap: 6px; border: 1px solid #444;
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #666; }
        .status-online .status-dot { background: #10b981; box-shadow: 0 0 5px #10b981; }
        .status-online { color: #10b981; background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); }

        .btn-reset-icon {
            background: #ef4444; color: white; border: none; width: 40px; height: 40px;
            border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
        }
        .btn-reset-icon:hover { background: #dc2626; transform: scale(1.05); }
        .btn-reset-icon:active { transform: scale(0.95); }
        .btn-reset-icon svg { width: 20px; height: 20px; fill: currentColor; }

        .main-container {
            display: flex; flex: 1; gap: 20px; padding: 20px; 
            max-width: 1600px; margin: 0 auto; width: 100%;
        }
        .canvas-section {
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; position: relative;
        }
        .canvas-wrapper {
            background: #1a1a1a; border-radius: 12px; padding: 10px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); display: inline-block;
            border: 2px solid transparent; transition: border-color 0.3s;
        }
        /* Visual cue for Place Mode */
        .canvas-wrapper.place-mode { border-color: #3b82f6; cursor: crosshair; }

        #mainCanvas {
            max-width: 100%; max-height: 80vh; border-radius: 4px; 
            cursor: crosshair; display: block; background: #000;
        }
        #mainCanvas { user-select: none; -webkit-user-select: none; }

        .control-section { width: 320px; display: flex; flex-direction: column; gap: 12px; }
        
        .step-button {
            width: 100%; padding: 15px; border: none; border-radius: 8px; 
            font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; 
            color: white; text-transform: uppercase; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .step-button:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; box-shadow: none; }
        .step-button:not(:disabled):hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        .step-sam { background: #8b5cf6; } 
        .step-ext-send { background: #0ea5e9; } 
        .step-ext-confirm { background: #059669; border: 1px solid #34d399; }
        .step-place { background: #f59e0b; } 
        .step-exec { background: #ec4899; } 

        .external-panel { background: rgba(255,255,255,0.05); border: 1px dashed #444; border-radius: 8px; padding: 10px; margin: 5px 0; }
        .external-panel h3 { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }

        .loading-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.85); padding: 25px; border-radius: 12px; display: none; 
            z-index: 100; text-align: center; border: 1px solid #333; min-width: 200px;
        }
        .spinner { width: 30px; height: 30px; border: 3px solid #333; border-top: 3px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .separator { text-align: center; color: #555; font-size: 11px; margin: 10px 0; position: relative; }
        .separator::before, .separator::after { content: ""; position: absolute; top: 50%; width: 35%; height: 1px; background: #333; }
        .separator::before { left: 0; } .separator::after { right: 0; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>🎯 SAM3 Live Teleop</h1>
            <p class="header-instructions" id="headerInstr">
                1. Define Grasp: <span class="highlight-pos">L-Click (Add)</span> | <span class="highlight-neg">R-Click (Remove)</span>
            </p>
        </div>
        <div class="header-right">
            <div id="extServiceStatus" class="status-badge">
                <div class="status-dot"></div><span id="extStatusText">Checking...</span>
            </div>
            
            <button class="btn-reset-icon" id="btnReset" title="Reset Session">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
        </div>
    </div>

    <div class="main-container">
        <div class="canvas-section">
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="mainCanvas" oncontextmenu="return false;"></canvas>
            </div>
            <div class="loading-overlay" id="loading">
                <div class="spinner"></div>
                <div id="loadingText">Processing...</div>
                <div id="loadingSubText" style="font-size: 12px; color: #888; margin-top: 5px;"></div>
            </div>
        </div>

        <div class="control-section">
            <button class="step-button step-sam" id="btnGenerateMask" disabled>
                <span>Generate Grasp Mask</span>
            </button>

            <div class="separator">OR EXTERNAL MASK</div>

            <div class="external-panel">
                <h3>Model Service</h3>
                <button class="step-button step-ext-send" id="btnSendExternal" disabled>Send View</button>
                <button class="step-button step-ext-confirm" id="btnConfirmExternal" style="display:none; margin-top:10px;">Confirm Mask</button>
            </div>

            <div class="separator">GOAL & ACTION</div>

            <button class="step-button step-place" id="btnSelectPlace" disabled>
                <span>Set Place Target</span>
            </button>

            <button class="step-button step-exec" id="btnExecuteGrasp" disabled>
                <span>Execute Grasp</span>
            </button>
        </div>
    </div>

    <script>
        // State Machine: 
        // 0 = Define Grasp (L/R Clicks)
        // 1 = Grasp Generated (Waiting for next step)
        // 2 = Define Place (Click sets target)
        // 3 = Ready to Execute
        const state = {
            step: 0, 
            pollingInterval: null,
            maskPollingInterval: null,
            points: [], // Grasp Points
            labels: [], // Grasp Labels
            externalServiceOnline: false,
            clickTimer: null,
            externalGraspMaskReceived: false, // Track if external grasp mask is received
            externalPlaceMaskReceived: false // Track if external place mask is received
        };

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        const wrapper = document.getElementById('canvasWrapper');
        const headerInstr = document.getElementById('headerInstr');
        
        const btns = {
            mask: document.getElementById('btnGenerateMask'),
            sendExt: document.getElementById('btnSendExternal'),
            confirmExt: document.getElementById('btnConfirmExternal'),
            place: document.getElementById('btnSelectPlace'),
            execute: document.getElementById('btnExecuteGrasp'),
            reset: document.getElementById('btnReset')
        };

        canvas.width = 640; canvas.height = 480;
        drawPlaceholder("Waiting for video stream...");
        checkExternalHealth();
        state.pollingInterval = setInterval(pollVideoFrame, 50);

        // --- Network / Polling ---

        async function checkExternalHealth() {
            const badge = document.getElementById('extServiceStatus');
            const text = document.getElementById('extStatusText');
            try {
                const res = await fetch('/external/health');
                const data = await res.json();
                if (data.status === 'online') {
                    badge.className = 'status-badge status-online'; text.innerText = "Ext Online";
                    state.externalServiceOnline = true;
                } else throw new Error();
            } catch (e) {
                badge.className = 'status-badge status-offline'; text.innerText = "Ext Offline";
                state.externalServiceOnline = false;
            }
            updateUI();
        }

        let lastFrameData = null;
        async function pollVideoFrame() {
            try {
                const res = await fetch('/get_frame');
                const data = await res.json();
                if (data.success && data.frame_data) {
                    if (lastFrameData !== data.frame_data || state.points.length > 0) {
                        renderImage(data.frame_data);
                        lastFrameData = data.frame_data;
                    }
                }
            } catch (e) { console.error(e); }
        }

        // --- Interaction Logic ---

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            const coords = getCanvasCoordinates(e);

            // MODE: PLACE SELECTION
            if (state.step === 2) {
                handlePlaceSelection(coords.x, coords.y);
                return;
            }

            // MODE: GRASP DEFINITION (Step 0)
            if (state.step === 0) {
                // Prevent duplicate clicks if spamming
                if (state.clickTimer === null) {
                    state.clickTimer = setTimeout(() => {
                        state.clickTimer = null;
                        // Left Click (0) = Label 1 (Positive)
                        // Right Click (2) = Label 0 (Negative)
                        const label = e.button === 2 ? 0 : 1; 
                        state.points.push([coords.x, coords.y]);
                        state.labels.push(label);
                        if (lastFrameData) renderImage(lastFrameData);
                        updateUI();
                    }, 150); 
                }
            }
        });

        // Double Click to undo last point (Only in Grasp mode)
        canvas.addEventListener('dblclick', (e) => {
            if (state.step !== 0) return;
            clearTimeout(state.clickTimer); state.clickTimer = null;
            const coords = getCanvasCoordinates(e);
            // Find nearest point
            let nearestIdx = -1;
            let minDist = 30;
            state.points.forEach((p, i) => {
                const d = Math.hypot(p[0]-coords.x, p[1]-coords.y);
                if (d < minDist) { minDist = d; nearestIdx = i; }
            });

            if (nearestIdx >= 0) {
                state.points.splice(nearestIdx, 1);
                state.labels.splice(nearestIdx, 1);
                if (lastFrameData) renderImage(lastFrameData);
                updateUI();
            }
        });

        // --- Button Handlers ---

        // 1. Generate Grasp Mask
        btns.mask.addEventListener('click', async () => {
            setLoading(true, "Refining Grasp...", "Running SAM3...");
            try {
                const res = await fetch('/predict_mask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ points: state.points, labels: state.labels })
                });
                const data = await res.json();
                if (data.success) {
                    state.step = 1; // Grasp Done, Ready for Place
                    updateUI();
                } else throw new Error(data.error);
            } catch (e) { alert("Error: " + e.message); }
            finally { setLoading(false); }
        });

        // 2. Select Place (Enter Mode)
        btns.place.addEventListener('click', () => { 
            state.step = 2; // Enter Place Mode
            updateUI(); 
        });

        async function handlePlaceSelection(x, y) {
            setLoading(true, "Generating Goal Mask...", "Click to update if needed");
            try {
                const res = await fetch('/select_place', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ x, y })
                });
                const data = await res.json();
                if(data.success) {
                    state.step = 3; // Ready to Execute (but stays clickable to update place)
                    // We don't need to manually draw; backend updates overlay with Blue mask
                    updateUI();
                }
            } catch(e) { console.error(e); } 
            finally { setLoading(false); }
        }

        // 3. External Logic
        btns.sendExt.addEventListener('click', async () => {
            setLoading(true, "Sending to External...", "Freezing view...");
            try {
                const sendRes = await fetch('/external/send_image', { method: 'POST' });
                if (!sendRes.ok) throw new Error("Failed to send");
                setLoading(true, "Waiting for External Masks...", "Polling grasp mask and place target...");
                startMaskPolling();
            } catch (e) { alert(e.message); setLoading(false); }
        });

        function startMaskPolling() {
            let attempts = 0;
            // Reset mask received states
            state.externalGraspMaskReceived = false;
            state.externalPlaceMaskReceived = false;
            
            if (state.maskPollingInterval) clearInterval(state.maskPollingInterval);
            state.maskPollingInterval = setInterval(async () => {
                attempts++;
                try {
                    // Poll both interfaces simultaneously
                    const [graspCheckRes, placeRes] = await Promise.all([
                        fetch('/check_grasp_mask').catch(() => null),
                        fetch('/check_place_mask').catch(() => null)
                    ]);
                    
                    // Check grasp mask (either in buffer or confirmed)
                    if (graspCheckRes && graspCheckRes.ok) {
                        const graspCheckData = await graspCheckRes.json();
                        if (graspCheckData.success && graspCheckData.has_grasp_mask && !state.externalGraspMaskReceived) {
                            state.externalGraspMaskReceived = true;
                            console.log("External grasp mask detected:", graspCheckData.is_confirmed ? "confirmed" : "in buffer");
                            // Update loading text
                            const placeStatus = state.externalPlaceMaskReceived ? "✓" : "waiting";
                            setLoading(true, "Waiting for External Masks...", `Grasp: ✓ | Place: ${placeStatus}`);
                        }
                    }
                    
                    // Check place mask
                    if (placeRes && placeRes.ok) {
                        const placeData = await placeRes.json();
                        if (placeData.success && placeData.has_place_mask && !state.externalPlaceMaskReceived) {
                            state.externalPlaceMaskReceived = true;
                            console.log("External place mask received");
                            // Update loading text
                            const graspStatus = state.externalGraspMaskReceived ? "✓" : "waiting";
                            setLoading(true, "Waiting for External Masks...", `Grasp: ${graspStatus} | Place: ✓`);
                        }
                    }
                    
                    // Update loading text with current status
                    if (attempts % 4 === 0) { // Update every 2 seconds
                        const graspStatus = state.externalGraspMaskReceived ? "✓" : "waiting";
                        const placeStatus = state.externalPlaceMaskReceived ? "✓" : "waiting";
                        setLoading(true, "Waiting for External Masks...", `Grasp: ${graspStatus} | Place: ${placeStatus}`);
                    }
                    
                    // If both masks are received, proceed
                    if (state.externalGraspMaskReceived && state.externalPlaceMaskReceived) {
                        clearInterval(state.maskPollingInterval);
                        
                        // Check if grasp mask needs to be confirmed
                        try {
                            const graspCheckRes2 = await fetch('/check_grasp_mask');
                            if (graspCheckRes2.ok) {
                                const graspCheckData2 = await graspCheckRes2.json();
                                
                                // If mask is not confirmed yet, confirm it
                                if (graspCheckData2.has_grasp_mask && !graspCheckData2.is_confirmed) {
                                    const confirmRes = await fetch('/external/receive_mask?confirm=true');
                                    if (!confirmRes.ok) {
                                        console.error("Failed to confirm grasp mask");
                                        return;
                                    }
                                }
                                
                                // Both masks received and confirmed, ready to execute
                                state.step = 3; // Ready to Execute
                                btns.sendExt.style.display = 'none';
                                btns.confirmExt.style.display = 'none'; // Auto-confirmed, no need for manual confirm
                                setLoading(false);
                                updateUI();
                                return;
                            }
                        } catch (e) {
                            console.error("Error confirming grasp mask:", e);
                        }
                    }
                    
                    // Timeout handling
                    if (attempts >= 120) { // 60 seconds (120 * 500ms)
                        clearInterval(state.maskPollingInterval);
                        setLoading(false);
                        const missing = [];
                        if (!state.externalGraspMaskReceived) missing.push("grasp mask");
                        if (!state.externalPlaceMaskReceived) missing.push("place mask");
                        alert(`Timeout awaiting external masks. Missing: ${missing.join(", ")}`);
                    }
                } catch (e) {
                    console.error("Mask polling error:", e);
                }
            }, 500);
        }

        btns.confirmExt.addEventListener('click', async () => {
            setLoading(true, "Locking Mask...");
            try { 
                await fetch('/external/receive_mask?confirm=true'); 
                state.externalGraspMaskReceived = true;
                // If place mask also received, go to step 3, otherwise step 1
                if (state.externalPlaceMaskReceived) {
                    state.step = 3;
                } else {
                    state.step = 1;
                }
                updateUI(); 
            } catch (e) { alert("Failed"); } finally { setLoading(false); }
        });

        // 4. Execute
        btns.execute.addEventListener('click', async () => {
            const btn = btns.execute;
            const originalText = btn.innerText;
            btn.innerText = "Sending...";
            btn.disabled = true;

            try {
                const res = await fetch('/execute_grasp', { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    btn.style.background = "#10b981"; // Success Green
                    btn.innerText = "✅ Command Sent!";
                    // We DO NOT reset here, to allow re-trying
                } else {
                    btn.style.background = "#ef4444";
                    btn.innerText = "❌ Failed";
                    alert(`Error: ${data.error}`);
                }

                // Reset button style after 2s
                setTimeout(() => {
                    btn.style.background = ""; // Reset to CSS default
                    btn.innerText = originalText;
                    btn.disabled = false;
                }, 2000);

            } catch (e) { 
                alert("Network Error"); 
                btn.disabled = false; 
                btn.innerText = originalText;
            }
        });

        // 5. Reset
        btns.reset.addEventListener('click', resetState);

        async function resetState() {
            setLoading(true, "Resetting...");
            try {
                await fetch('/reset', { method: 'POST' });
                state.step = 0;
                state.points = []; state.labels = [];
                if (state.maskPollingInterval) clearInterval(state.maskPollingInterval);
                btns.sendExt.style.display = 'block';
                btns.confirmExt.style.display = 'none';
                updateUI();
            } catch(e) { console.error(e); } 
            finally { setLoading(false); }
        }

        // --- Rendering ---

        function renderImage(b64) {
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width; canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                // Only draw points during Grasp Definition (Step 0)
                if (state.step === 0) drawGraspPoints();
            };
            img.src = b64;
        }

        function drawGraspPoints() {
            state.points.forEach((p, i) => {
                ctx.beginPath(); ctx.arc(p[0], p[1], 6, 0, Math.PI*2);
                ctx.fillStyle = state.labels[i] === 1 ? '#10b981' : '#ef4444';
                ctx.fill(); ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
            });
        }

        function drawPlaceholder(text) {
            ctx.fillStyle = "#111"; ctx.fillRect(0,0,640,480);
            ctx.fillStyle = "#555"; ctx.font = "20px Arial";
            ctx.textAlign = "center"; ctx.fillText(text, 320, 240);
        }

        // --- UI Updates ---

        function updateUI() {
            // Button states
            btns.mask.disabled = state.step !== 0 || state.points.length === 0;
            btns.sendExt.disabled = state.step !== 0 || !state.externalServiceOnline;
            
            // Place button is enabled only after Grasp is defined (Step 1+)
            btns.place.disabled = state.step < 1;
            if (state.step === 2 || state.step === 3) {
                btns.place.innerText = "Update Place Target";
                btns.place.style.border = "1px solid #fff";
            } else {
                btns.place.innerText = "Set Place Target";
                btns.place.style.border = "none";
            }

            // Execute is enabled only after Place is defined (Step 3)
            btns.execute.disabled = state.step < 3;

            // Header Instructions
            if (state.step === 0) {
                headerInstr.innerHTML = `1. Define Grasp: <span class="highlight-pos">L-Click (Add)</span> | <span class="highlight-neg">R-Click (Remove)</span>`;
                wrapper.classList.remove('place-mode');
            } else if (state.step === 1) {
                headerInstr.innerHTML = `2. Grasp Set. Click <b>"Set Place Target"</b> to continue.`;
                wrapper.classList.remove('place-mode');
            } else if (state.step >= 2) {
                headerInstr.innerHTML = `3. Define Place: <span class="highlight-place">Click anywhere</span> to set goal.`;
                wrapper.classList.add('place-mode');
            }
        }

        function setLoading(active, text="Processing...", subtext="") {
            loading.style.display = active ? 'block' : 'none';
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingSubText').innerText = subtext;
        }
    </script>
</body>
</html>
